server.port=${PORT:8080}

# Las credenciales NO van en este archivo (se sube a GitHub).
#  - En local: archivo local.properties (ignorado por git), junto al pom.xml.
#  - En Render: variables de entorno MYSQL_ADDON_HOST, _PORT, _DB, _USER, _PASSWORD.
spring.config.import=optional:file:./local.properties

# --- MySQL en Clever Cloud ---
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT:3306}/${MYSQL_ADDON_DB}?allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El plan gratuito de Clever Cloud limita las conexiones simultáneas: pool pequeño
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# update: crea las tablas la primera vez y conserva los datos entre reinicios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Vistas Thymeleaf
spring.thymeleaf.cache=true
spring.mvc.format.date=iso
