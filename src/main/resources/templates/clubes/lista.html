<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clubes')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<main class="max-w-6xl mx-auto p-4 space-y-4">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold">Clubes</h2>
    <a href="/clubes/nuevo" class="btn btn-success">+ Nuevo club</a>
  </div>
  <div class="bg-white rounded-xl shadow p-3">
    <select id="filtro" class="form-select w-auto mb-3">
      <option value="">Todas las federaciones</option>
      <option th:each="a : ${federaciones}" th:value="${a.nombre}" th:text="${a.nombre + ' (' + a.pais + ')'}"></option>
    </select>
    <div class="overflow-x-auto">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>#</th><th>Club</th><th>Asociación</th><th>Entrenador</th><th>Jugadores</th><th></th></tr></thead>
      <tbody>
        <tr th:each="c : ${clubes}" th:data-asoc="${c.asociacion()}">
          <td th:text="${c.id()}"></td>
          <td class="font-semibold" th:text="${c.nombre()}"></td>
          <td th:text="${c.asociacion() ?: '—'}"></td>
          <td th:text="${c.entrenadorNombre() != null ? c.entrenadorNombre() + ' ' + c.entrenadorApellido() : '—'}"></td>
          <td><span class="badge text-bg-secondary" th:text="${c.jugadores()}"></span></td>
          <td class="text-end whitespace-nowrap">
            <a class="btn btn-sm btn-primary" th:href="@{|/clubes/${c.id()}|}">Ver</a>
            <a class="btn btn-sm btn-warning" th:href="@{|/clubes/${c.id()}/editar|}">Editar</a>
            <form class="d-inline" method="post" th:action="@{|/clubes/${c.id()}/eliminar|}" onsubmit="return confirm('¿Eliminar el club con sus jugadores y su entrenador?')">
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clubes)}"><td colspan="6" class="text-center text-muted py-4">Sin clubes registrados</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
document.getElementById('filtro').addEventListener('change', e =>
  document.querySelectorAll('tbody tr[data-asoc]').forEach(r => r.style.display = !e.target.value || r.dataset.asoc === e.target.value ? '' : 'none'));
</script>
</body>
</html>
