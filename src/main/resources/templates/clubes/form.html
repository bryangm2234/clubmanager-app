<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Club')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<main class="max-w-6xl mx-auto p-4 space-y-4">
  <h2 class="text-2xl font-bold" th:text="${form.id == null ? 'Nuevo club' : 'Editar club'}"></h2>
  <form method="post" th:action="@{/clubes/guardar}" th:object="${form}" class="bg-white rounded-xl shadow p-4">
    <input type="hidden" th:field="*{id}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Nombre del club</label><input class="form-control" th:field="*{nombre}" required></div>
      <div class="col-md-6"><label class="form-label">Asociación</label>
        <select class="form-select" th:field="*{asociacionId}">
          <option value="">— Sin asociación —</option>
          <option th:each="a : ${asociaciones}" th:value="${a.id}" th:data-ambitos="${ambitos[a.id]}" th:text="${a.nombre + ' (' + a.pais + ')'}"></option>
        </select></div>
      <div class="col-12"><hr class="my-1"><b>Entrenador</b></div>
      <div class="col-md-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{entrenador.nombre}"></div>
      <div class="col-md-3"><label class="form-label">Apellido</label><input class="form-control" th:field="*{entrenador.apellido}"></div>
      <div class="col-md-2"><label class="form-label">Edad</label><input type="number" min="0" class="form-control" th:field="*{entrenador.edad}"></div>
      <div class="col-md-4"><label class="form-label">Nacionalidad</label><input class="form-control" th:field="*{entrenador.nacionalidad}"></div>
      <div class="col-12"><label class="form-label">Competiciones (Ctrl/Cmd para varias)</label>
        <div class="form-text mb-1">Solo se muestran los torneos de la federación del club o de su confederación.</div>
        <select class="form-select" multiple size="5" th:field="*{competicionIds}">
          <option th:each="c : ${competiciones}" th:value="${c.id}" th:data-ambito="${c.ambito}" th:text="${c.nombre + ' · ' + (c.ambito ?: 'Internacional')}"></option>
        </select></div>
    </div>
    <div class="mt-4"><button class="btn btn-success">Guardar</button> <a class="btn btn-secondary" href="/clubes">Cancelar</a></div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
const sel = document.getElementById('asociacionId'), comps = document.getElementById('competicionIds');
function filtrar() {
  const o = sel.selectedOptions[0], ok = o && o.dataset.ambitos ? o.dataset.ambitos.split(',') : [];
  [...comps.options].forEach(c => { const permitido = ok.includes(c.dataset.ambito); c.hidden = c.disabled = !permitido; if (!permitido) c.selected = false; });
}
sel.addEventListener('change', filtrar); filtrar();
</script>
</body>
</html>
