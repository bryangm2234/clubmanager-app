<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Club')}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<main class="max-w-6xl mx-auto p-4 space-y-4">
  <div class="flex justify-between items-center">
    <h2 class="text-3xl font-bold text-emerald-800" th:text="${club.nombre()}"></h2>
    <div><a class="btn btn-warning btn-sm" th:href="@{|/clubes/${club.id()}/editar|}">Editar</a> <a class="btn btn-outline-secondary btn-sm" href="/clubes">Volver</a></div>
  </div>
  <div class="grid md:grid-cols-3 gap-4">
    <div class="bg-white rounded-xl shadow p-4 border-t-4 border-emerald-500">
      <h3 class="text-sm uppercase text-slate-500 font-semibold">Entrenador</h3>
      <div th:if="${club.entrenador() != null}">
        <p class="text-lg font-bold mb-1" th:text="${club.entrenador().nombre + ' ' + club.entrenador().apellido}"></p>
        <p class="mb-0">Edad: <span th:text="${club.entrenador().edad}"></span></p>
        <p class="mb-0">Nacionalidad: <span th:text="${club.entrenador().nacionalidad}"></span></p>
      </div>
      <p class="text-muted" th:if="${club.entrenador() == null}">Sin entrenador asignado</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 border-t-4 border-sky-500">
      <h3 class="text-sm uppercase text-slate-500 font-semibold">Asociación</h3>
      <div th:if="${club.asociacion() != null}">
        <p class="text-lg font-bold mb-1" th:text="${club.asociacion().nombre + (club.asociacion().siglas != null ? ' (' + club.asociacion().siglas + ')' : '')}"></p>
        <p class="mb-0">País: <span th:text="${club.asociacion().pais}"></span></p>
        <p class="mb-0">Presidente: <span th:text="${club.asociacion().presidente}"></span></p>
      </div>
      <p class="text-muted" th:if="${club.asociacion() == null}">Sin asociación</p>
    </div>
    <div class="bg-white rounded-xl shadow p-4 border-t-4 border-amber-500">
      <h3 class="text-sm uppercase text-slate-500 font-semibold">Competiciones</h3>
      <div th:each="c : ${club.competiciones()}" class="mb-2 pb-2 border-bottom">
        <p class="font-bold mb-0" th:text="${c.nombre}"></p>
        <small class="text-muted" th:text="${'Premio: $' + c.montoPremio + ' · ' + c.fechaInicio + ' → ' + c.fechaFin}"></small>
      </div>
      <p class="text-muted" th:if="${#lists.isEmpty(club.competiciones())}">No inscrito en competiciones</p>
    </div>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <h3 class="text-lg font-semibold mb-3">Jugadores</h3>
    <div class="overflow-x-auto">
      <table class="table table-striped align-middle">
        <thead><tr><th>N°</th><th>Nombre</th><th>Apellido</th><th>Posición</th><th></th></tr></thead>
        <tbody>
          <tr th:each="j : ${club.jugadores()}">
            <td class="fw-bold" th:text="${j.numero}"></td><td th:text="${j.nombre}"></td><td th:text="${j.apellido}"></td>
            <td><span class="badge text-bg-info" th:text="${j.posicion}"></span></td>
            <td class="text-end"><form method="post" th:action="@{|/clubes/${club.id()}/jugadores/${j.id}/eliminar|}" onsubmit="return confirm('¿Quitar este jugador?')"><button class="btn btn-sm btn-outline-danger">Quitar</button></form></td>
          </tr>
          <tr th:if="${#lists.isEmpty(club.jugadores())}"><td colspan="5" class="text-center text-muted">Sin jugadores</td></tr>
        </tbody>
      </table>
    </div>
    <form method="post" th:action="@{|/clubes/${club.id()}/jugadores|}" class="row g-2 align-items-end border-top pt-3">
      <div class="col-md-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Apellido</label><input name="apellido" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Número</label><input name="numero" type="number" min="1" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Posición</label>
        <select name="posicion" class="form-select"><option>Portero</option><option>Defensa</option><option>Mediocampista</option><option>Delantero</option></select></div>
      <div class="col-md-2"><button class="btn btn-success w-100">+ Agregar</button></div>
    </form>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
