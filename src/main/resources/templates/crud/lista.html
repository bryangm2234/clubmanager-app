<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<main class="max-w-6xl mx-auto p-4 space-y-4">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold" th:text="${titulo}"></h2>
    <a th:if="${permiteNuevo}" th:href="@{|${base}/nuevo|}" class="btn btn-success">+ Nuevo</a>
  </div>
  <div class="bg-white rounded-xl shadow p-3 overflow-x-auto">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>#</th><th th:each="c : ${cols}" th:text="${c[1]}"></th><th></th></tr></thead>
      <tbody>
        <tr th:each="it : ${items}">
          <td th:text="${it.id}"></td>
          <td th:each="c : ${cols}" th:text="${it[c[0]]}"></td>
          <td class="text-end whitespace-nowrap">
            <a class="btn btn-sm btn-warning" th:href="@{|${base}/${it.id}/editar|}">Editar</a>
            <form class="d-inline" method="post" th:action="@{|${base}/${it.id}/eliminar|}" onsubmit="return confirm('¿Eliminar este registro?')">
              <button class="btn btn-sm btn-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}"><td th:colspan="${#lists.size(cols) + 2}" class="text-center text-muted py-4">Sin registros</td></tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
