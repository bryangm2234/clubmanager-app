<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="bg-slate-100 min-h-screen">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<main class="max-w-6xl mx-auto p-4 space-y-4">
  <h2 class="text-2xl font-bold" th:text="${item.id == null ? 'Nuevo/a ' + singular : 'Editar ' + singular}"></h2>
  <form method="post" th:action="@{|${base}/guardar|}" class="bg-white rounded-xl shadow p-4 max-w-2xl">
    <input type="hidden" name="id" th:value="${item.id}">
    <div class="mb-3" th:each="f : ${campos}">
      <label class="form-label" th:text="${f[1]}"></label>
      <input class="form-control" th:name="${f[0]}" th:type="${f[2]}" th:value="${item[f[0]]}" th:required="${f[0] != 'ambito'}">
    </div>
    <button class="btn btn-success">Guardar</button>
    <a class="btn btn-secondary" th:href="@{${base}}">Cancelar</a>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
