<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · ClubManager'">ClubManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
</head>
<body>
<nav th:fragment="nav" class="bg-emerald-700 text-white shadow sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
    <a href="/" class="text-xl font-bold text-white no-underline">⚽ Club<span class="text-emerald-200">Manager</span></a>
    <div class="flex flex-wrap items-center gap-1">
        <a href="/" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri == '/'} ? 'bg-emerald-900 font-semibold'">🏠 Inicio</a>
        <a href="/clubes" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri != null and uri.startsWith('/clubes')} ? 'bg-emerald-900 font-semibold'">🏟️ Clubes</a>
        <a href="/entrenadores" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri != null and uri.startsWith('/entrenadores')} ? 'bg-emerald-900 font-semibold'">🧑‍🏫 Entrenadores</a>
        <a href="/jugadores" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri != null and uri.startsWith('/jugadores')} ? 'bg-emerald-900 font-semibold'">👕 Jugadores</a>
        <a href="/asociaciones" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri != null and uri.startsWith('/asociaciones')} ? 'bg-emerald-900 font-semibold'">🏛️ Asociaciones</a>
        <a href="/competiciones" class="px-3 py-1.5 rounded-md text-white no-underline text-sm hover:bg-emerald-600" th:classappend="${uri != null and uri.startsWith('/competiciones')} ? 'bg-emerald-900 font-semibold'">🏆 Competiciones</a>
        <a href="/api/clubes" target="_blank" class="px-3 py-1.5 rounded-md text-emerald-100 no-underline text-sm border border-emerald-400 hover:bg-emerald-600 ml-1">🔌 API</a>
    </div>
  </div>
</nav>
<div th:fragment="mensajes" class="max-w-6xl mx-auto px-4 mt-3">
  <div class="alert alert-success mb-0" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert alert-danger mb-0" th:if="${error}" th:text="${error}"></div>
</div>
<th:block th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></th:block>
</body>
</html>
